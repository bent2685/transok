name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal
    needs: read-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build dash assets
        run: bash scripts/build-dash.sh

      - name: mygo build (darwin/universal)
        run: go tool mygo build -platform darwin/universal

      - name: Add fix-damaged script to dmg
        run: scripts/add-fix-script.sh dist/darwin-universal/*.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transok-darwin
          path: dist/darwin-universal/*

  windows:
    name: Windows amd64
    needs: read-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build dash assets
        shell: bash
        run: bash scripts/build-dash.sh

      - name: mygo build (windows/amd64)
        run: go tool mygo build -platform windows/amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transok-windows
          path: dist/windows-amd64/*

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [read-version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -lh dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          for f in *; do
            if [ -f "$f" ] && [ "$f" != SHA256SUMS ]; then
              sha256sum "$f"
            fi
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Locate release notes
        id: notes
        run: |
          ver="${{ needs.read-version.outputs.version }}"
          notes="release/${ver}-release.md"
          if [ ! -f "$notes" ]; then
            echo "::error file=$notes::release notes not found. Create $notes before tagging v${ver}."
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*
          fail_on_unmatched_files: true
