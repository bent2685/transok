name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # tag 与 VERSION 不一致时，release 任务会把新产物挂到旧版本的 release 上且不报错，
      # 所以在构建之前就拦住。
      - name: Verify tag matches VERSION
        run: |
          ver="${{ steps.v.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (v${ver}). Run 'make version V=<x.y.z>' and commit before tagging."
            exit 1
          fi

      - name: Verify version consistency
        run: node scripts/set-version.mjs --check

      # 发布说明同时是 Release 正文和应用内更新窗口的内容，缺失或写得不合格就别构建了。
      - name: Verify release notes
        run: node scripts/release-notes.mjs --check

  # 构建前先建好草稿 Release（正文取自发布说明），各平台再往里传文件；
  # 没有它，每个 mygo build -upload 会各建一个草稿。
  draft-release:
    needs: read-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.read-version.outputs.version }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$notes"
          fi

  macos:
    name: macOS universal
    needs: [read-version, draft-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build dash assets
        run: bash scripts/build-dash.sh

      - name: Generate update changelog
        run: node scripts/release-notes.mjs --changelog

      - name: mygo build (darwin/universal) and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/universal -upload

      # 修复脚本是构建后才塞进 dmg 的，mygo 上传的是不带它的版本，这里覆盖上传。
      # 更新走的是 tar.gz，不受 dmg 变化影响。
      - name: Add fix-damaged script to dmg and re-upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.read-version.outputs.version }}
        run: |
          scripts/add-fix-script.sh dist/darwin-universal/*.dmg
          gh release upload "$TAG" dist/darwin-universal/*.dmg --clobber

  windows:
    name: Windows amd64
    needs: [read-version, draft-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build dash assets
        shell: bash
        run: bash scripts/build-dash.sh

      - name: Generate update changelog
        run: node scripts/release-notes.mjs --changelog

      - name: mygo build (windows/amd64) and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload

# 草稿 Release 由人工检查后点 Publish；发布后应用才会收到更新。
# 之后用 transok-release skill 把发布说明标为 released 并开下一个版本。
