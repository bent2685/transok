name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 下载页产物是提交进仓库、由 go:embed 嵌入的，改了 dash/ 却忘了重新构建就会发布旧页面。
      - name: Build dash
        run: make dash-force

      - name: Embedded dash assets are up to date
        run: |
          if [ -n "$(git status --porcelain -- backend/app/templates/downpage)" ]; then
            git status --short -- backend/app/templates/downpage
            echo "::error::backend/app/templates/downpage is stale. Run 'make dash-force' and commit the result."
            exit 1
          fi

      - name: Check
        run: make check
